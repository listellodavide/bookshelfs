services:
  # 1. Database: Store books data
  postgres:
    image: postgres:16
    container_name: postgres-booksdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
    ports:
      - "5433:5432"
    volumes:
      - postgres-data-books:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres-booksdb -p 5432 -U books -d books"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - books-network

networks:
  books-network:
    driver: bridge

volumes:
  postgres-data-books: