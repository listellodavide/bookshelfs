server:
  port: 8084
spring:
  application:
    name: kafka-producer-bookstore
  main:
    web-application-type: reactive
  cloud:
    function:
      definition: sensorEventProducer # Registers the function
    stream:
      bindings:
        sensorEventProducer-out-0:
          destination: sensor_event_topic
          # This MUST be here to bypass Spring's internal JSON conversion, ignore idea errors
          useNativeEncoding: true
          producer:
            poller:
              fixed-delay: 5000
      kafka:
        binder:
          # Global Kafka settings for the binder
          configuration:
            schema.registry.url: http://localhost:8081
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
            # Fallback serializer
            value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
        bindings:
          sensorEventProducer-out-0:
            producer:
              configuration:
                # Specific serializer for THIS binding
                value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                schema.registry.url: http://localhost:8081

